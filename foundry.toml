[profile.default]
evm_version = "osaka"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read-write", path = "./"}]
gas_reports = ["*"]
gas_limit = "18446744073709551615"
dynamic_test_linking = true
ignored_warnings_from = ["test/","script/"]
ffi = true
no_match_coverage = "^(script|test)/"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
hoodi = "${ETH_RPC_URL_HOODI}"
holesky = "${ETH_RPC_URL_HOLESKY}"
sepolia = "${ETH_RPC_URL_SEPOLIA}"

[fmt]
bracket_spacing = false
int_types = "long"
line_length = 120
multiline_func_header = "attributes_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
single_line_statement_blocks = "preserve"
sort_imports = false
contract_new_lines = false
override_spacing = false
hex_underscore = "preserve"
wrap_comments = false

[lint]
lint_on_build = false
exclude_lints = ["asm-keccak256","mixed-case-function","mixed-case-variable","pascal-case-struct","screaming-snake-case-const"]
ignore = ["test/**/*.sol","script/**/*.sol","src/interfaces/**/*.sol"]

[profile.default.fuzz]
runs = 100
max_test_rejects = 4294967295

[profile.default.invariant]
runs = 16
depth = 64
max_time_delay = 1209600
max_block_delay = 2

# Fork CI runs every mainnet suite against a single provider key and was tripping HTTP 429,
# which surfaces as `sharedbackend: Failed to send/recv` and then bare `EvmError: Revert`
# rather than as an obvious rate-limit error. These must live here rather than on the command
# line: forge gates --compute-units-per-second/--fork-retries/--fork-retry-backoff behind
# --rpc-url, and --rpc-url is an alias for --fork-url, which would fork every test.
[profile.pr]
compute_units_per_second = 200
fork_retries = 10
fork_retry_backoff = 4

[profile.pr.fuzz]
runs = 100
max_test_rejects = 4294967295

[profile.pr.invariant]
runs = 32
depth = 128
check_interval = 16
max_time_delay = 1209600
max_block_delay = 2

[profile.ci.fuzz]
runs = 100
max_test_rejects = 4294967295

[profile.ci.invariant]
runs = 128
depth = 256
check_interval = 32
max_time_delay = 1209600
max_block_delay = 2

[profile.debug]
via_ir = false
optimizer_runs = 200
fuzz.runs = 100

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
